{% extends "base.html" %}
{% block title %}Forgot password · {{ site_name }}{% endblock %}
{% block content %}
<main class="page narrow">
  <div class="page-head"><div><h1>Forgot password</h1><p>The admin will reset it and give you a temporary password.</p></div></div>
  <form class="card form" method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Email you signed up with <input class="input" name="email" type="email" required autofocus autocomplete="email"></label>
    <label>Note for the admin (optional) <input class="input" name="note" maxlength="200" placeholder="e.g. it's Sam from 3rd period"></label>
    <button class="btn full">Send request</button>
    <p class="muted small"><a href="{{ url_for('login') }}">Back to log in</a></p>
  </form>
</main>
{% endblock %}
