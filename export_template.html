<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SITE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
{{ANALYTICS}}<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d17; --card: #151827; --card-hover: #1c2034; --border: rgba(255,255,255,0.08);
    --text: #eef0f8; --muted: #9aa1b8; --accent: #8b5cf6; --accent2: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: Manrope, system-ui, -apple-system, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; padding: 16px max(16px, calc((100vw - 1200px) / 2));
    background: rgba(11, 13, 23, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; margin-right: auto; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #search {
    flex: 1 1 260px; max-width: 420px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
  .chip {
    padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent;
    color: var(--muted); font: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 20px max(16px, calc((100vw - 1200px) / 2)) 40px; }
  #count { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .game {
    display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden; cursor: pointer;
    border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit;
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
  }
  .game:hover, .game:focus-visible { transform: translateY(-3px); background: var(--card-hover); border-color: var(--accent); outline: none; }
  .cover { aspect-ratio: 1; width: 100%; background: linear-gradient(135deg, #24204a, #123a48); display: grid; place-items: center; font-size: 2rem; font-weight: 800; color: rgba(255,255,255,0.5); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { padding: 9px 10px 11px; font-size: 0.82rem; font-weight: 700; line-height: 1.3; }
  .empty { color: var(--muted); text-align: center; padding: 50px 0; }

  #player { position: fixed; inset: 0; z-index: 10; background: #000; display: flex; flex-direction: column; }
  #player[hidden] { display: none; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--border); }
  .bar h2 { flex: 1; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn {
    padding: 7px 14px; border-radius: 9px; border: 1px solid var(--border); background: transparent;
    color: var(--text); font: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--card-hover); }
  .btn.main { background: var(--accent); border-color: var(--accent); }
  #frame { flex: 1; width: 100%; border: 0; background: #000; }
  #status { position: absolute; inset: 52px 0 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 20px; }
  #status[hidden] { display: none; }
  @media (max-width: 520px) { #newtab { display: none; } }

  .tabs { display: flex; gap: 4px; }
  .tab { padding: 7px 14px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer; }
  .tab.on { background: var(--card); color: var(--text); }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; display: grid; place-items: center; }
  .icon-btn.on { border-color: var(--accent); color: var(--accent); }
  .panel {
    position: fixed; right: 16px; top: 70px; z-index: 20; width: 290px; max-height: calc(100vh - 90px); overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .panel[hidden] { display: none; }
  .panel h4 { font-size: 0.9rem; }
  .panel h4 + h4, .panel .section { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--border); }
  .hint { font-size: 0.75rem; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .input { width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; font-size: 0.85rem; outline: none; }
  .input:focus { border-color: var(--accent); }
  #movies { max-width: 640px; }
  #movies h2 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }
  #movies .note { color: var(--muted); margin: 6px 0 18px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  a.btn { display: inline-block; text-decoration: none; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1><span>✦</span> {{SITE}}</h1>
  <nav class="tabs">
    <button class="tab on" data-view="games">Games</button>
    <button class="tab" data-view="movies">Movies</button>
  </nav>
  <input id="search" type="search" placeholder="Search games…" autocomplete="off">
  <button class="icon-btn" id="cloak-btn" title="Tab cloak &amp; panic key" aria-label="Tab cloak and panic key">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <div class="chips" id="chips"></div>
</header>

<div class="panel" id="panel" hidden>
  <h4>Tab cloak</h4>
  <p class="hint">Change this tab's title and icon. Remembered next time.</p>
  <div class="grid2">
    <button class="btn" data-cloak-title="Dashboard" data-cloak-icon="https://canvas.instructure.com/favicon.ico">Canvas</button>
    <button class="btn" data-cloak-title="Google Docs" data-cloak-icon="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico">Google Docs</button>
    <button class="btn" data-cloak-title="Google Classroom" data-cloak-icon="https://ssl.gstatic.com/classroom/favicon.png">Classroom</button>
    <button class="btn" data-cloak-title="Khan Academy" data-cloak-icon="https://cdn.kastatic.org/images/favicon.ico">Khan Academy</button>
  </div>
  <input class="input" id="cloak-title" placeholder="Tab title">
  <input class="input" id="cloak-icon" placeholder="Icon URL (optional)">
  <div class="grid2">
    <button class="btn main" id="cloak-apply">Apply</button>
    <button class="btn" id="cloak-reset">Reset</button>
  </div>

  <h4 class="section">Panic key</h4>
  <p class="hint">Press it to instantly leave for another page. Back won't bring you here.</p>
  <button class="btn" id="panic-key">Click, then press a key</button>
  <input class="input" id="panic-url" placeholder="Go to (e.g. canvas.instructure.com)">
  <div class="grid2">
    <button class="btn main" id="panic-save">Save</button>
    <button class="btn" id="panic-off">Turn off</button>
  </div>
</div>

<main>
  <section id="games-view">
    <p id="count"></p>
    <div id="grid"></div>
  </section>
  <section id="movies" hidden>
    <h2>Movies</h2>
    <p class="note">Heads up: not all the links work, but most of them do.</p>
    <div class="card" id="movies-body"></div>
  </section>
</main>

<div id="player" hidden>
  <div class="bar">
    <button class="btn" id="back">← Back</button>
    <h2 id="title"></h2>
    <button class="btn" id="newtab">Open in new tab</button>
    <button class="btn main" id="full">Fullscreen</button>
  </div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>
  <div id="status" hidden></div>
</div>

<script>
const GAMES = {{DATA}};
const MOVIES_DOC = {{MOVIES_DOC}};
const SITE = {{SITE_JSON}};
const track = (name, params) => { try { window.gtag && gtag("event", name, params); } catch (e) {} };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

// ── tab cloak ──
let pageTitle = SITE;
const originalIcon = document.querySelector("link[rel='icon']").href;
function setIcon(url) {
  document.querySelectorAll("link[rel='icon']").forEach((l) => l.remove());
  const link = document.createElement("link");
  link.rel = "icon";
  link.href = url;
  document.head.appendChild(link);
}
function setTitle(t) {
  pageTitle = t;
  const cloak = store.get("nova_cloak");
  document.title = (cloak && cloak.title) || t;
}
function applyCloak() {
  const cloak = store.get("nova_cloak");
  setTitle(pageTitle);
  setIcon((cloak && cloak.icon) || originalIcon);
  document.getElementById("cloak-btn").classList.toggle("on", !!cloak);
}
applyCloak();
const panel = document.getElementById("panel");
document.getElementById("cloak-btn").onclick = (e) => { e.stopPropagation(); panel.hidden = !panel.hidden; };
document.addEventListener("click", (e) => { if (!e.target.closest(".panel")) panel.hidden = true; });
const titleIn = document.getElementById("cloak-title"), iconIn = document.getElementById("cloak-icon");
document.querySelectorAll("[data-cloak-title]").forEach((b) => {
  b.onclick = () => { titleIn.value = b.dataset.cloakTitle; iconIn.value = b.dataset.cloakIcon; };
});
document.getElementById("cloak-apply").onclick = () => {
  const title = titleIn.value.trim(), icon = iconIn.value.trim();
  if (!title && !icon) return;
  store.set("nova_cloak", { title, icon });
  applyCloak();
  panel.hidden = true;
};
document.getElementById("cloak-reset").onclick = () => {
  store.del("nova_cloak");
  titleIn.value = iconIn.value = "";
  applyCloak();
};

// ── panic key ──
const PANIC_DEFAULT = "https://canvas.instructure.com";
const panic = store.get("nova_panic");
let choosingKey = false;
const keyName = (k) => (k === " " ? "Space" : k.length === 1 ? k.toUpperCase() : k);
function onPanicKey(e) {
  if (!panic || choosingKey || e.key !== panic.key || e.repeat) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) && panic.key.length === 1) return;
  e.preventDefault();
  location.replace(panic.url || PANIC_DEFAULT);  // replace(): Back can't return here
}
window.addEventListener("keydown", onPanicKey, true);
// Games loaded through the downloader run in a same-site frame, so listen there too.
function hookFrame(f) { try { f.contentWindow.addEventListener("keydown", onPanicKey, true); } catch (e) {} }
const panicBtn = document.getElementById("panic-key"), panicUrl = document.getElementById("panic-url");
let chosen = panic ? panic.key : "";
const panicLabel = () => { panicBtn.textContent = chosen ? `Panic key: ${keyName(chosen)}` : "Click, then press a key"; };
panicLabel();
panicUrl.value = panic ? panic.url : "";
panicBtn.onclick = () => {
  panicBtn.textContent = "Press any key…";
  choosingKey = true;
  document.addEventListener("keydown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    choosingKey = false;
    if (e.key !== "Escape") chosen = e.key;
    panicLabel();
  }, { capture: true, once: true });
};
document.getElementById("panic-save").onclick = () => {
  if (!chosen) { panicBtn.textContent = "Pick a key first"; return; }
  let url = panicUrl.value.trim() || PANIC_DEFAULT;
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  store.set("nova_panic", { key: chosen, url });
  location.reload();
};
document.getElementById("panic-off").onclick = () => { store.del("nova_panic"); location.reload(); };

// ── Games / Movies tabs ──
const moviesBody = document.getElementById("movies-body");
if (MOVIES_DOC) {
  moviesBody.innerHTML = '<p>The full movie list is in this doc:</p><a class="btn main" target="_blank" rel="noopener">Open the movies list</a>';
  const a = moviesBody.querySelector("a");
  a.href = MOVIES_DOC;
  a.onclick = () => track("open_movies_doc");
} else {
  moviesBody.innerHTML = '<p class="hint">The movie list is coming soon. Check back later!</p>';
}
document.querySelectorAll(".tab").forEach((t) => {
  t.onclick = () => {
    const movies = t.dataset.view === "movies";
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
    document.getElementById("games-view").hidden = movies;
    document.getElementById("movies").hidden = !movies;
    document.getElementById("search").hidden = movies;
    document.getElementById("chips").hidden = movies;
    track("page_view", { page_title: movies ? "Movies" : "Games", page_location: location.href.split("#")[0] + (movies ? "#movies" : "") });
  };
});

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const chips = document.getElementById("chips");
const count = document.getElementById("count");
let genre = "";

// Genre chips, most common first (only genres that a few games share).
const tally = {};
GAMES.forEach((g) => g.g.forEach((x) => (tally[x] = (tally[x] || 0) + 1)));
const genres = Object.keys(tally).filter((x) => tally[x] >= 2).sort((a, b) => tally[b] - tally[a]);
if (genres.length) {
  ["All", ...genres].forEach((name) => {
    const b = document.createElement("button");
    b.className = "chip" + (name === "All" ? " on" : "");
    b.textContent = name;
    b.onclick = () => {
      genre = name === "All" ? "" : name;
      chips.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === b));
      render();
    };
    chips.appendChild(b);
  });
}

// Build every card once, then show/hide them while searching.
const cards = GAMES.map((g, i) => {
  const b = document.createElement("button");
  b.className = "game";
  const cover = document.createElement("div");
  cover.className = "cover";
  cover.textContent = g.n.charAt(0).toUpperCase();
  if (g.i) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.src = g.i;
    img.onload = () => { cover.textContent = ""; cover.appendChild(img); };
  }
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = g.n;
  b.append(cover, name);
  b.onclick = () => play(i);
  grid.appendChild(b);
  return b;
});
const empty = document.createElement("p");
empty.className = "empty";
empty.textContent = "No games match that.";
grid.after(empty);

function render() {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  GAMES.forEach((g, i) => {
    const ok = (!q || g.n.toLowerCase().includes(q)) && (!genre || g.g.includes(genre));
    cards[i].hidden = !ok;
    if (ok) shown++;
  });
  count.textContent = `${shown} game${shown === 1 ? "" : "s"}`;
  empty.hidden = shown > 0;
}
search.addEventListener("input", render);
render();

// ── player ──
const player = document.getElementById("player");
const frame = document.getElementById("frame");
const statusEl = document.getElementById("status");
let current = null, blobUrl = null;

function setStatus(text) { statusEl.textContent = text; statusEl.hidden = !text; }

async function sourceFor(g) {
  if (g.u) return g.u;
  let html = g.h;
  if (g.r) {
    // Raw GitHub files come back as plain text: download, point relative paths home, run.
    const r = await fetch(g.r);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const base = `<base href="${g.r.slice(0, g.r.lastIndexOf("/") + 1)}">`;
    html = await r.text();
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head([^>]*)>/i, `<head$1>${base}`) : base + html;
  }
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  return blobUrl;
}

async function play(i, fromHistory) {
  current = GAMES[i];
  document.getElementById("title").textContent = current.n;
  setTitle(current.n);
  track("play_game", { game_name: current.n });
  player.hidden = false;
  frame.removeAttribute("src");
  setStatus(`Loading ${current.n}…`);
  if (!fromHistory) history.pushState({ game: i }, "", "#" + encodeURIComponent(current.n));
  try {
    const src = await sourceFor(current);
    if (current !== GAMES[i]) return;  // picked another game while this one loaded
    frame.src = src;
    frame.onload = () => { setStatus(""); hookFrame(frame); };
    frame.focus();
  } catch (err) {
    setStatus(`Couldn't load this game (${err.message}). The link may be broken or blocked on this network.`);
  }
}

function closePlayer() {
  player.hidden = true;
  frame.removeAttribute("src");
  current = null;
  setTitle(SITE);
}
document.getElementById("back").onclick = () => history.back();
window.addEventListener("popstate", (e) => (e.state && e.state.game != null ? play(e.state.game, true) : closePlayer()));
document.getElementById("full").onclick = () => frame.requestFullscreen && frame.requestFullscreen();
document.getElementById("newtab").onclick = async () => {
  if (!current) return;
  if (current.u) return void window.open(current.u, "_blank", "noopener");
  window.open(await sourceFor(current), "_blank");
};
</script>
</body>
</html>
